name: Release Addon

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g., 1.0.0)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        run: npm install -g pnpm

      - name: Install addon dependencies
        working-directory: addon
        run: pnpm install

      - name: Build addon
        working-directory: addon
        run: pnpm build

      - name: Create addon ZIP
        working-directory: addon
        run: pnpm package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Monzo Addon ${{ github.event.inputs.version || github.ref_name }}
          files: addon/dist/monzo-addon-*.zip
          draft: false
          prerelease: false
          body: |
            ## Monzo Bank Sync Addon for Wealthfolio

            ### Installation
            1. Download the `monzo-addon-*.zip` below
            2. In Wealthfolio → Settings → Add-ons → Install from ZIP
            3. Set up the proxy and configure the addon (see [README](https://github.com/dpremoli/MonzoAddOn#readme))

            ### What's included
            - `manifest.json` — addon metadata and permissions
            - `dist/addon.js` — compiled addon bundle

            ### Requirements
            - Wealthfolio 3.3.0+
            - Monzo Proxy running (see README for setup)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
